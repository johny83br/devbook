<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevBook - Editar usuário</title>

  <link href="/assets/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer">

</head>

<body>

  {{ template "cabecalho" }}

  <div class="container-fluid">
    <div class="row mt-4">
      <div class="col-12">
        <h3>Editar Dados</h3>
        <form id="editar-usuario">
          <div class="form-group">
            <label for="nome">Nome</label>
            <input type="text" name="nome" id="nome" class="form-control" placeholder="Insira o seu nome"
              value="{{ .Nome }}" required>
          </div>
          <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" name="email" id="email" class="form-control" placeholder="Insira o seu e-mail"
              value="{{ .Email }}" required>
          </div>
          <div class="form-group">
            <label for="nick">Nick</label>
            <input type="text" name="nick" id="nick" class="form-control" placeholder="Insira o seu nick"
              value="{{ .Nick }}" required>
          </div>
          <button type="submit" class="btn btn-info">Atualizar dados</button>
        </form>
      </div>
    </div>
  </div>

  {{ template "rodape" }}
  {{ template "scripts" }}

  <script src="/assets/js/usuario.js"></script>

</body>

</html>
