<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevBook - Cadastro de Usuário</title>


  <link rel="stylesheet" type="text/css" href="/assets/css/login.css">
</head>

<body>
  <div class="container-login">
    <div>
      <form class="devbook-form" id="formulario-cadastro">
        <span>Crie a sua conta agora mesmo!</span>
        <div>
          <input type="text" name="nome" id="nome" placeholder="Digite o seu nome" required="required">
        </div>
        <div>
          <input type="text" name="email" id="email" placeholder="Digite o seu e-mail" required="required">
        </div>
        <div>
          <input type="text" name="nick" id="nick" placeholder="Digite o seu nick" required="required">
        </div>
        <div>
          <input type="password" name="senha" id="senha" placeholder="Digite a sua senha" required="required">
        </div>
        <div>
          <input type="password" name="confirmar_senha" id="confirmar_senha" placeholder="Confirme a sua senha"
            required="required">
        </div>
        <p align="center"><a href="/login"> Clique aqui para fazer o login</a></p>
        <button type="submit" class="btn-devbook">Cadastrar</button>
      </form>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-4.0.0.min.js"
    integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
  <script src="/assets/js/cadastro.js"></script>

</body>

</html>
