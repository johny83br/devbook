<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevBook - Atualizar Publicação - {{ .Titulo }}</title>

  <link href="/assets/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer">

</head>

<body>

  {{ template "cabecalho" }}

  <div class="container-fluid">
    <div class="row mt-4">
      <div class="col-12">
        <h3>Editar Publicação</h3>
        <div class="form-group">
          <label for="titulo" class="form-label">Título</label>
          <input type="text" class="form-control" id="titulo" name="titulo" value="{{ .Titulo }}"
            placeholder="Insira o título da sua publicação" required>
        </div>
        <div class="form-group">
          <label for="conteudo" class="form-label">Conteúdo</label>
          <textarea class="form-control" id="conteudo" name="conteudo" rows="5"
            placeholder="Insira o conteúdo da sua publicação" required>{{ .Conteudo }}</textarea>
        </div>
        <button class="btn btn-info mt-3" data-publicacao-id="{{ .ID }}" id="atualizar-publicacao">Atualizar
          Publicação</button>
      </div>
    </div>
  </div>

  {{ template "rodape" }}

  {{ template "scripts" }}

</body>

</html>
